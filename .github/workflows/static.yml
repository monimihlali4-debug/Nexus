 <div class="history-item">Dynamic visual engine: Active</div>
 <div class="history-item">Command input: Active</div>
 <div class="history-item">Browser voice input: Available where supported</div>
 <div class="history-item">External AI intelligence engine: Not connected</div>
 <div class="history-item">Secure user authentication: Not implemented</div>
 <div class="history-item">Cloud memory and database: Not connected</div>
</section>
</main>

<footer>
 NEXUS · PERSONAL INTELLIGENCE SYSTEM · VERSION 3.0<br>
 YOUR VISION. YOUR INTELLIGENCE. YOUR COMMAND.
</footer>

<script>
// NEXUS DYNAMIC BACKGROUND
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let particles=[];
function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
 particles=Array.from({length:55},()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+0.5,
  dx:(Math.random()-.5)*.35,
  dy:(Math.random()-.5)*.35
 }));
}
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach(p=>{
  p.x+=p.dx;p.y+=p.dy;
  if(p.x<0||p.x>canvas.width)p.dx*=-1;
  if(p.y<0||p.y>canvas.height)p.dy*=-1;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle='rgba(97,232,237,.65)';
  ctx.fill();
 });
 requestAnimationFrame(animate);
}
addEventListener('resize',resize);
resize();animate();

// COMMAND CENTRE
let history=[];
function execute(){
 const input=document.getElementById('command');
 const value=input.value.trim();
 const output=document.getElementById('response');
 if(!value){
  output.textContent='Please enter a command first.';
  return;
 }
 history.unshift(value);
 renderHistory();
 output.textContent=
 'COMMAND RECEIVED\n\n'+value+
 '\n\nYour request has been captured by the NEXUS interface. '+
 'The real AI engine is not yet connected. A protected backend '+
 'and AI model integration are required for intelligent answers.';
 document.getElementById('engineStatus').textContent=
 'AI ENGINE: WAITING FOR SECURE BACKEND CONNECTION';
}
function choose(area){
 document.getElementById('command').value=
 'Help me with '+area+'.';
 document.getElementById('command').focus();
 window.scrollTo({top:0,behavior:'smooth'});
}
function clearCommand(){
 document.getElementById('command').value='';
 document.getElementById('response').textContent=
 'Command cleared. NEXUS is ready.';
}
function renderHistory(){
 document.getElementById('history').innerHTML='';
 history.slice(0,10).forEach(item=>{
  const div=document.createElement('div');
  div.className='history-item';
  div.textContent=item;
  document.getElementById('history').appendChild(div);
 });
}
function clearHistory(){
 history=[];
 document.getElementById('history').textContent=
 'No commands recorded yet.';
}

// LOCAL SESSION PROFILE
function saveProfile(){
 const name=document.getElementById('profile').value.trim();
 if(!name)return;
 try{localStorage.setItem('nexus_profile',name)}catch(e){}
 document.getElementById('profileStatus').textContent=
 'Profile saved on this browser: '+name;
}
try{
 const saved=localStorage.getItem('nexus_profile');
 if(saved){
  document.getElementById('profile').value=saved;
  document.getElementById('profileStatus').textContent=
  'Local profile loaded: '+saved;
 }
}catch(e){}

// BROWSER VOICE INPUT
function voiceInput(){
 const Recognition=window.SpeechRecognition||
 window.webkitSpeechRecognition;
 const status=document.getElementById('voiceStatus');
 if(!Recognition){
  status.textContent='Speech recognition is not supported by this browser.';
  return;
 }
 const recognition=new Recognition();
 recognition.lang='en-US';
 recognition.onstart=()=>status.textContent='LISTENING...';
 recognition.onresult=e=>{
  document.getElementById('command').value=
  e.results[0][0].transcript;
  status.textContent='VOICE COMMAND CAPTURED';
 };
 recognition.onerror=()=>status.textContent='VOICE INPUT ERROR';
 recognition.onend=()=>status.textContent+=' · STANDBY';
 recognition.start();
}
</script>
