<body>
<canvas id="particles"></canvas>

<header>
 <div class="logo">NEXUS</div>
 <div class="live">● SYSTEM ACTIVE</div>
</header>

<main>
<section class="hero">
 <div class="eyebrow">PERSONAL INTELLIGENCE SYSTEM / 03</div>
 <div class="core-wrap">
  <div class="ring"></div>
  <div class="ring two"></div>
  <div class="core"></div>
 </div>
 <div class="eyebrow">INTELLIGENCE INTERFACE</div>
 <h1>Your world. One intelligence.</h1>
 <p class="muted">Think bigger. Discover possibilities. Make informed decisions.</p>
 <div class="statusline">NEXUS VERSION 3.0 · INTERFACE RUNNING</div>
</section>

<section class="panel">
 <div class="panel-head">
  <h2>01 / COMMAND CENTRE</h2>
  <span class="tag">COMMAND INTERFACE</span>
 </div>
 <p class="muted">Tell NEXUS what you need. Your command is prepared for the intelligence engine.</p>
 <textarea id="command" placeholder="Ask a question, explain a problem, or describe an idea..."></textarea>
 <div class="actions">
  <button onclick="execute()">Execute command →</button>
  <button class="secondary" onclick="clearCommand()">Clear</button>
  <button class="secondary" onclick="voiceInput()">🎙 Voice</button>
 </div>
 <div id="response" class="result" aria-live="polite">
 NEXUS is ready for your command.
 </div>
 <p class="statusline" id="engineStatus">AI ENGINE: BACKEND CONNECTION REQUIRED</p>
</section>

<section class="panel">
 <div class="panel-head">
  <h2>02 / LIFE INTELLIGENCE</h2>
  <span class="tag">SIX DOMAINS</span>
 </div>
 <p class="muted">An intelligence system designed for the whole of life.</p>
 <div class="grid">
  <div class="tile" onclick="choose('Money and opportunities')">
   <div class="symbol">◈</div><strong>Money & Opportunities</strong>
  </div>
  <div class="tile" onclick="choose('Business and entrepreneurship')">
   <div class="symbol">⌘</div><strong>Business & Enterprise</strong>
  </div>
  <div class="tile" onclick="choose('Education and learning')">
   <div class="symbol">◎</div><strong>Learning & Education</strong>
  </div>
  <div class="tile" onclick="choose('Planning and productivity')">
   <div class="symbol">◷</div><strong>Planning & Productivity</strong>
  </div>
  <div class="tile" onclick="choose('Everyday life assistance')">
   <div class="symbol">◇</div><strong>Everyday Life</strong>
  </div>
  <div class="tile" onclick="choose('Ideas and problem solving')">
   <div class="symbol">✧</div><strong>Ideas & Solutions</strong>
  </div>
  <div class="tile" onclick="choose('Research and information')">
   <div class="symbol">⌕</div><strong>Research & Discovery</strong>
  </div>
  <div class="tile" onclick="choose('Personal development and goals')">
   <div class="symbol">↗</div><strong>Personal Growth</strong>
  </div>
 </div>
</section>

<section class="panel">
 <h2>03 / PERSONAL PROFILE</h2>
 <p class="muted">Set your local session profile.</p>
 <input id="profile" placeholder="Enter your preferred name">
 <button onclick="saveProfile()">Save profile</button>
 <p class="statusline" id="profileStatus"></p>
</section>

<section class="panel">
 <h2>04 / VOICE INTERFACE</h2>
 <p class="muted">Voice input uses browser speech recognition when supported. It does not yet provide private voice authentication.</p>
 <button class="secondary" onclick="voiceInput()">🎙 Activate voice input</button>
 <p class="statusline" id="voiceStatus">VOICE SYSTEM: STANDBY</p>
</section>

<section class="panel">
 <div class="panel-head">
  <h2>05 / COMMAND HISTORY</h2>
  <span class="tag">LOCAL SESSION</span>
 </div>
